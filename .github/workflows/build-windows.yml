
name: Build NyxenPlayer for Windows

on:
  push:
    paths:
      - 'src/**'
      - 'build/**'
      - 'main.js'
      - 'preload.js'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows Installer and Portable App
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify project files
        shell: pwsh
        run: |
          if (!(Test-Path "package.json")) {
            throw "package.json was not found in the repository root."
          }

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Install dependencies
        run: npm install

      - name: Build installer and portable executable
        run: npm run dist

      - name: Verify build outputs
        shell: pwsh
        run: |
          if (!(Test-Path "dist")) {
            throw "Build failed: dist directory was not created."
          }

          $files = Get-ChildItem -Path "dist" -Filter "*.exe" -File

          if ($files.Count -eq 0) {
            throw "Build failed: no Windows executable files were found."
          }

          Write-Host "Successfully generated:"
          $files | ForEach-Object {
            Write-Host "$($_.Name) - $([math]::Round($_.Length / 1MB, 2)) MB"
          }

      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: NyxenPlayer-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
