name: Build NyxenPlayer for Windows
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable exe
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: NyxenPlayer-windows
          path: windows/dist/*.exe
          retention-days: 30
