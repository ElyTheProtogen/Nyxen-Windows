<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NyxenPlayer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' nyxen: data: blob:; media-src nyxen: blob:; font-src 'self' nyxen: data:; connect-src nyxen:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bg">
    <i class="blob b1"></i>
    <i class="blob b2"></i>
  </div>

  <div id="drag"></div>

  <div id="shell">
    <aside id="side">
      <div class="brand">
        <img src="logo.png" alt="">
        <span>NYXEN</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidefoot" id="sidefoot"></div>
    </aside>

    <main id="main"></main>
  </div>

  <footer id="bar"></footer>

  <section id="np" class="off"></section>
  <section id="queue" class="off"></section>

  <section id="video-player" class="off" aria-label="Video player">
    <div class="video-player-header">
      <button id="video-back" type="button" aria-label="Close video player">
        <span>←</span>
      </button>

      <div class="video-player-title">
        <span class="video-label">NOW PLAYING</span>
        <h2 id="video-title">Video</h2>
      </div>

      <div class="video-header-actions">
        <button id="video-audio-track" type="button" aria-label="Choose audio track" title="Choose audio track">Audio</button>
        <button id="video-fullscreen" type="button" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </div>

    <div class="video-screen">
      <video id="nyxen-video" controls playsinline preload="metadata"></video>
    </div>
  </section>

  <div id="menu" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="toast"></div>

  <script src="queue-utils.js"></script>
  <script src="near-duplicate-utils.js"></script>
  <script src="library-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
