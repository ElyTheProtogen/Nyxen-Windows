<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NyxenPlayer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' nyxen: data:; media-src nyxen:; font-src 'self' nyxen: data:; connect-src nyxen:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="bg"><i class="blob b1"></i><i class="blob b2"></i></div>
  <div id="drag"></div>
  <div id="shell">
    <aside id="side">
      <div class="brand"><img src="logo.png" alt=""><span>NYXEN</span></div>
      <nav id="nav"></nav>
      <div class="sidefoot" id="sidefoot"></div>
    </aside>
    <main id="main"></main>
  </div>
  <footer id="bar"></footer>
  <section id="np" class="off"></section>
  <section id="queue" class="off"></section>
  <div id="menu" class="hidden"></div>
  <div id="modal" class="hidden"></div>
  <div id="welcome" class="hidden"></div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
